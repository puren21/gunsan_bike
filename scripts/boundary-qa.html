<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>행정경계 표시용 파일 비교</title><style>body{font:15px/1.6 system-ui;color:#172033;background:#f4f7fb;margin:24px}h1{font-size:24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}section{margin:20px 0}figure{background:white;border-radius:10px;padding:12px;margin:0}figcaption{font-weight:bold}canvas{width:100%;height:240px}#status{color:#0b6b46}</style></head><body><h1>행정경계 원본 ↔ 표시용 복사본</h1><p>로컬 정적 파일 비교입니다. 카카오 배경지도 검증 화면은 아닙니다. 원본 자료는 수정하지 않았습니다.</p><p id="status" role="status">자료를 불러오는 중…</p><main id="views"></main><script>
if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('Local QA only');
const polygonRings=f=>f.geometry.type==='Polygon'?f.geometry.coordinates:f.geometry.coordinates.flat();
async function main(){const files=['/Township%20Boundary.geojson','/data/display/township-v1.geojson'];const [original,display]=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error('파일 로드 실패');return r.json();}));const coords=original.features.flatMap(polygonRings).flat();let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const [x,y]of coords){minX=Math.min(x,minX);maxX=Math.max(x,maxX);minY=Math.min(y,minY);maxY=Math.max(y,maxY);}const views=[['군산 전체 경계',[minX,minY,maxX,maxY]],['도심 확대',[126.703,35.958,126.753,35.995]],['아주 작은 섬 확대',[125.98030,36.11268,125.98040,36.11276]]];for(const [label,bounds]of views){const section=document.createElement('section'),heading=document.createElement('h2'),pair=document.createElement('div');heading.textContent=label;pair.className='pair';section.append(heading,pair);document.getElementById('views').append(section);[original,display].forEach((data,i)=>{const fig=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=i?'표시용 · 작은 도형 정밀도 보존':'원본 · 읽기 전용';canvas.width=800;canvas.height=480;fig.append(caption,canvas);pair.append(fig);const ctx=canvas.getContext('2d'),[a,b,c,d]=bounds,ratio=Math.min(760/((c-a)*Math.cos(36*Math.PI/180)),440/(d-b)),project=p=>[20+(p[0]-a)*Math.cos(36*Math.PI/180)*ratio,460-(p[1]-b)*ratio];ctx.strokeStyle=i?'#087e8b':'#334155';ctx.lineWidth=1.4;for(const f of data.features){ctx.beginPath();for(const ring of polygonRings(f)){ring.forEach((p,n)=>{const [x,y]=project(p);if(n)ctx.lineTo(x,y);else ctx.moveTo(x,y);});ctx.closePath();}ctx.stroke();}});}document.getElementById('status').textContent='원본 '+original.features.length+'개 / 표시용 '+display.features.length+'개 지물 · 전체·도심·작은 섬 비교 로드 완료';}
main().catch(e=>document.getElementById('status').textContent=e.message);
</script></body></html>
